name: ANIIMO News

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

jobs:
  news:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install requests

      - name: Ripristina memoria delle news
        uses: actions/cache@v4
        with:
          path: published.json
          key: aniimo-news-memory-${{ github.run_id }}
          restore-keys: |
            aniimo-news-memory-

      - name: Avvia ANIIMO News
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py
